services:
  db:
    image: postgres:17-alpine
    container_name: expenvia-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: expenvia
      POSTGRES_PASSWORD: expenvia_dev_only
      POSTGRES_DB: expenvia
    ports:
      - "5433:5432"
    volumes:
      - expenvia-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U expenvia -d expenvia"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  expenvia-pgdata:
